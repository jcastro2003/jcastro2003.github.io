<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Widget Recreation Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="weather">
            <img 
                src="images/partly-sunny.svg"
                alt="Partly Sunny"
            >

            <p id="temperature">81°</p>
                
            <p id="time-location">14:26</p>
            
            <p id="date-location">
                Wed 20 May
                <br>
                Seattle, WA
            </p>
            
        </div>
    </body>
</html>
