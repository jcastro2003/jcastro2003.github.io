<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it">
                <h2>Hey! I'm a post-it!</h2>
            </div>

            <div class="post-it">
                <p>Reminders to check the fridge for leftovers!</p>
            </div>

            <div class="post-it yellow">
                <p>Believe in yourself!</p>
            </div>
            
            <br><br>
            
            <div class="post-it">
                <img 
                    src="images/camping.jpg"
                    alt="A tent in the woods" 
                    class="img"
                >
            </div>
            
            <div class="post-it light-blue">
                <h2>Camping Trip Supplies!</h2>
                <ul>
                    <li>Tent</li>
                    <li>Sleeping Bag</li>
                    <li>Flashlight</li>
                    <li>Bug Spray</li>
                </ul>
            </div>

            <div class="post-it orange">
                <h2>Don't forget to water the plants!</h2>
            </div>

        </div>
    </body>
</html>
